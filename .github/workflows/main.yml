name: Build Firmware

on:
  push:
    branches: [main]   # other branches are built through their pull request
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Exact PlatformIO version used by the last verified build. The platform
  # (espressif32@7.1.3) and library versions are pinned in platformio.ini.
  PIO_CORE_VERSION: "6.2.0"

jobs:
  # One job per firmware profile, run in parallel. Each job builds its own
  # firmware (and filesystem image where the profile has one). The per-profile
  # "fw-*" uploads are only a hand-over to the bundle job; the bundle job
  # deletes them again, so the run ends with ONE download: cartouch-firmware.
  build:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - env: esp32-s3-devkitc-1
            partitions: cartouch_16MB.csv
            fs: true
            extra: .pio/build/esp32-s3-devkitc-1/firmware.elf
          - env: esp32-s3-headless
            partitions: cartouch_16MB.csv
            fs: false
            extra: ""
          - env: esp32-s3-4mb
            partitions: cartouch_4MB.csv
            fs: true
            extra: ""
          - env: esp32-s3-4mb-psram
            partitions: cartouch_4MB.csv
            fs: true
            extra: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # The toolchain/framework cache only depends on the pinned platform
      # lines, so editing build flags or libraries does not throw away
      # ~1 GB of cached packages.
      - name: Compute cache key
        id: keys
        run: |
          platforms=$(grep -hE '^platform *=' platformio.ini | sort -u | sha256sum | cut -c1-16)
          echo "pio=pio-build-${RUNNER_OS}-core${PIO_CORE_VERSION}-${platforms}-v1" >> "$GITHUB_OUTPUT"

      - name: Cache PlatformIO packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ steps.keys.outputs.pio }}

      # Libraries are pinned, so this cache is exact: it is only reused for
      # the same platformio.ini.
      - name: Cache libraries (${{ matrix.env }})
        uses: actions/cache@v5
        with:
          path: .pio/libdeps/${{ matrix.env }}
          key: libdeps-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: |
          for attempt in 1 2 3; do
            if pip install --retries 10 --timeout 60 "platformio==${PIO_CORE_VERSION}"; then
              exit 0
            fi
            echo "::warning::PlatformIO installation failed (attempt $attempt/3); retrying in 20s"
            sleep 20
          done
          echo "::error::PlatformIO installation failed after 3 attempts"
          exit 1

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

      - name: Build filesystem image
        if: matrix.fs == true
        run: pio run -e ${{ matrix.env }} -t buildfs

      - name: Validate generated SPIFFS image fits partition
        if: matrix.fs == true
        run: python3 scripts/check_spiffs_image.py ${{ matrix.partitions }} .pio/build/${{ matrix.env }}/spiffs.bin

      # boot_app0.bin (flashed at 0xE000 for manual flashing) is not produced
      # by the build itself; take it from the Arduino framework package.
      - name: Copy boot_app0.bin
        run: |
          src=$(find ~/.platformio/packages -name boot_app0.bin -path '*tools/partitions*' | head -n 1)
          if [ -n "$src" ]; then
            cp "$src" ".pio/build/${{ matrix.env }}/boot_app0.bin"
          else
            echo "::warning::boot_app0.bin not found in the framework package"
          fi

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: fw-${{ matrix.env }}
          path: |
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/bootloader.bin
            .pio/build/${{ matrix.env }}/partitions.bin
            .pio/build/${{ matrix.env }}/boot_app0.bin
            .pio/build/${{ matrix.env }}/spiffs.bin
            ${{ matrix.extra }}
          if-no-files-found: error
          retention-days: 1

  # Collects the four builds into the same single download as before
  # (cartouch-firmware: one folder per profile) and checks OTA slot space.
  bundle:
    name: Collect firmware and check OTA slot size
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write   # needed only to delete the temporary fw-* artifacts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          pattern: fw-*
          path: parts

      - name: Assemble bundle
        run: |
          mkdir -p bundle
          for dir in parts/fw-*; do
            name="${dir#parts/fw-}"
            mkdir -p "bundle/${name}"
            cp -a "${dir}/." "bundle/${name}/"
          done
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          for image in Path("bundle").rglob("*"):
              if image.is_file() and image.name in ("firmware.bin", "spiffs.bin"):
                  digest = hashlib.sha256(image.read_bytes()).hexdigest()
                  image.with_name(image.name + ".sha256").write_text(digest + "\n", encoding="ascii")
          PY
          find bundle -type f | sort

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cartouch-firmware
          path: bundle
          if-no-files-found: error
          retention-days: 30

      # The bundle above already contains everything, so the temporary
      # per-profile uploads are removed to leave a single download.
      - name: Remove temporary per-profile artifacts
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const list = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: context.runId });
            for (const a of list) {
              if (a.name.startsWith('fw-')) {
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id });
                core.info('Deleted temporary artifact ' + a.name);
              }
            }

      # Runs after the upload so the images are kept even if a slot is too small.
      - name: Firmware size vs OTA slot
        run: |
          set +e
          python3 scripts/check_fw_size.py 8192 bundle --strict | tee size.txt
          status=${PIPESTATUS[0]}
          {
            echo '### Firmware size vs OTA slot'
            echo '```'
            cat size.txt
            echo '```'
            echo
            echo '### Files in bundle (bytes)'
            echo '```'
            find bundle -type f -printf '%s %p\n' | sort -k2
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  # Source checks, static analysis and unit tests. Quick checks that need no
  # PlatformIO run first so a simple mistake fails within seconds.
  checks:
    name: Source checks, static analysis and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Prepare report folder
        run: mkdir -p report

      - name: Validate SPIFFS path lengths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("data")
          bad = []
          for path in root.rglob("*"):
              if path.is_file():
                  rel = "/" + path.relative_to(root).as_posix()
                  # SPIFFS default maximum path/filename length is 32 bytes
                  # including the terminating NUL, so 31 visible characters.
                  if len(rel) > 31:
                      bad.append(f"{len(rel)}: {rel}")
          if bad:
              raise SystemExit("SPIFFS path(s) exceed the 31-character visible limit:\n" + "\n".join(bad))
          print(f"SPIFFS path-length check passed for {sum(1 for p in root.rglob('*') if p.is_file())} files")
          PY

      - name: Validate built-in DBC references and operator UI language
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          source = Path("src/vehicle_db.cpp").read_text(encoding="utf-8")
          refs = set(re.findall(r'"(/dbc/[^" ]+\.dbc)"', source))
          missing = sorted(ref for ref in refs if not Path("data" + ref).is_file())
          if missing:
              raise SystemExit("Missing DBC file(s):\n" + "\n".join(missing))
          print(f"DBC reference check passed for {len(refs)} built-in profiles")

          for rel in ("data/index.html", "data/app.js", "src/webserver.cpp", "src/tft_ui.cpp"):
              text = Path(rel).read_text(encoding="utf-8")
              if any("\u0600" <= ch <= "\u06ff" for ch in text):
                  raise SystemExit(f"Operator-facing UI source contains Persian/Arabic text: {rel}")
          print("Operator UI language check passed")
          PY

      - name: Verify only approved modules transmit on CAN
        run: |
          set -o pipefail
          python3 scripts/check_tx_paths.py src 2>&1 | tee report/check_tx_paths.txt

      - name: Verify no ct* function exists only for the tests
        run: |
          set -o pipefail
          python3 scripts/check_dead_ct_symbols.py . 2>&1 | tee report/check_dead_ct_symbols.txt

      - name: Check DBC limits match the loader
        run: |
          set -o pipefail
          python3 scripts/check_dbc_limits.py . 2>&1 | tee report/check_dbc_limits.txt

      - name: Audit DBC files (duplicates, duplicate ids)
        run: |
          set -o pipefail
          python3 scripts/audit_dbc.py --check 2>&1 | tee report/audit_dbc.txt
          python3 scripts/audit_dbc.py 2>&1 | tee -a report/audit_dbc.txt

      - name: Compute cache key
        id: keys
        run: |
          platforms=$(grep -hE '^platform *=' platformio.ini | sort -u | sha256sum | cut -c1-16)
          echo "pio=pio-checks-${RUNNER_OS}-core${PIO_CORE_VERSION}-${platforms}-v1" >> "$GITHUB_OUTPUT"

      - name: Cache PlatformIO packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ steps.keys.outputs.pio }}

      - name: Cache libraries
        uses: actions/cache@v5
        with:
          path: .pio/libdeps
          key: libdeps-checks-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: |
          for attempt in 1 2 3; do
            if pip install --retries 10 --timeout 60 "platformio==${PIO_CORE_VERSION}"; then
              exit 0
            fi
            echo "::warning::PlatformIO installation failed (attempt $attempt/3); retrying in 20s"
            sleep 20
          done
          echo "::error::PlatformIO installation failed after 3 attempts"
          exit 1

      # Explicit, so later steps (the bit-timing check reads the installed
      # MCP2515 header) never depend on what `pio check` happens to install.
      - name: Install project dependencies
        run: pio pkg install -e esp32-s3-devkitc-1 -e esp32-s3-4mb

      - name: Static analysis
        run: |
          set -o pipefail
          pio check -e esp32-s3-devkitc-1 --skip-packages 2>&1 | tee report/pio_check_16mb.txt

      - name: Static analysis (4 MB profile)
        run: |
          set -o pipefail
          pio check -e esp32-s3-4mb --skip-packages 2>&1 | tee report/pio_check_4mb.txt

      # Reads the header PlatformIO installed above, so it runs after the
      # static-analysis steps. It passed on the first real run, so it is now
      # a hard check (no continue-on-error).
      - name: Verify MCP2515 8 MHz bit-timing table
        run: |
          set -o pipefail
          python3 scripts/check_mcp_timing.py 2>&1 | tee report/mcp_timing.txt

      - name: Native unit tests
        run: |
          set -o pipefail
          pio test -e native -v 2>&1 | tee report/native_tests.txt

      # Always runs, even after a failure, so the numbers are visible on the
      # run summary page and in the small "ci-report" download.
      - name: Write run summary
        if: always()
        run: |
          {
            echo '### Native unit tests'
            echo '```'
            grep -E "test_main.cpp:[0-9]+:.*:(PASS|FAIL)" report/native_tests.txt | grep -c ":PASS" | sed 's/^/passed: /' || true
            grep -E ":FAIL" report/native_tests.txt || true
            grep -E "Tests? .*(Failures|Ignored)|[0-9]+ test cases" report/native_tests.txt || true
            echo '```'
            echo '### Static analysis (pio check)'
            echo '```'
            grep -hE "HIGH|MEDIUM|LOW|Total|PASSED|FAILED|defect" report/pio_check_*.txt | tail -n 30 || true
            echo '```'
            echo '### MCP2515 bit timing'
            echo '```'
            cat report/mcp_timing.txt 2>/dev/null || true
            echo '```'
            echo '### DBC audit (first lines)'
            echo '```'
            head -n 12 report/audit_dbc.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Only a hand-over to the "logs" job below, which merges it with the job
      # logs into the single "ci-report" download and deletes this temporary one.
      - name: Upload CI report (temporary)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-report-part
          path: report
          if-no-files-found: ignore
          retention-days: 1

  # Always runs last (success, failure or cancellation). It puts the check
  # report and the logs of all other jobs into two small downloads:
  #   ci-report   results of the checks and tests
  #   logs        run-summary.txt, jobs.json and one .log per job
  # Together with "cartouch-firmware" (only when every build is green) the run
  # always ends with the same three downloads. A problem here never turns the
  # run red (continue-on-error).
  logs:
    name: Collect run logs
    needs: [build, bundle, checks]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      actions: write   # read this run's logs; delete the temporary ci-report-part

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true

      - name: Download check report
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ci-report-part
          path: ci-report

      - name: Download job logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/collect_run_logs.py logs

      - name: Write run summary
        if: always()
        run: |
          {
            echo '### Run logs (download artifact "logs")'
            echo '```'
            cat logs/run-summary.txt 2>/dev/null || echo 'no summary was produced'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ci-report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-report
          path: ci-report
          if-no-files-found: warn
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs
          path: logs
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary report artifact
        if: always()
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const list = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: context.runId });
            for (const a of list) {
              if (a.name === 'ci-report-part') {
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id });
                core.info('Deleted temporary artifact ' + a.name);
              }
            }
