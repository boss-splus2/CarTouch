; CarTouch - ESP32-S3 Car Control via CAN Bus
; PlatformIO Project Configuration File
;
; برای کامپایل و آپلود:
;   pio run -t upload
; برای آپلود فایل‌های SPIFFS (وب):
;   pio run -t uploadfs

[platformio]
boards_dir = boards

; Versions below are pinned to what the last verified CI build used, so two
; builds of the same commit are identical. To update one, change it here, run
; CI, and check the size table (the 4 MB slot has little free space).
[env:esp32-s3-devkitc-1]
platform = espressif32@7.1.3
board = cartouch-esp32-s3-n16r8
framework = arduino
; N16R8 profile: 16MB QIO flash and 8MB OPI PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram = enable
board_build.f_cpu = 240000000L
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    -DCT_REQUIRED_FLASH_BYTES=16777216
    -DCONFIG_LVGL_USE_PSRAM=1
    -O2
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_CS=10
    -DTFT_DC=7
    -DTFT_RST=4
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_MISO=13
    -DTFT_BL=21
    -DUSE_FSPI_PORT
    -DTOUCH_CS=14
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLV_CONF_SKIP=1
    -DLV_USE_PERF_MONITOR=0
    -DLV_MEM_CUSTOM=1
    -DLV_MEMCPY_MEMSET_STD=1
    -DLV_USE_IME_PINYIN=0
    -DLV_USE_FLOAT=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_48=1

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    lvgl/lvgl@8.4.0
    ESP32Async/ESPAsyncWebServer@3.12.1
    ESP32Async/AsyncTCP@3.5.0
    bblanchon/ArduinoJson@7.4.3
    h2zero/NimBLE-Arduino@2.5.1
    autowp/autowp-mcp2515@1.3.1

lib_ignore =

board_build.partitions = cartouch_16MB.csv
board_upload.flash_size = 16MB
check_flags = --suppress=preprocessorErrorDirective:*

[env:esp32-s3-headless]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DCARTOUCH_HEADLESS=1

[env:esp32-s3-4mb]
extends = env:esp32-s3-devkitc-1
board = cartouch-esp32-s3-4mb-nopsram
board_build.arduino.memory_type = qio_qspi
board_build.psram = disabled
board_build.partitions = cartouch_4MB.csv
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
build_flags =
    -Os
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_CS=10
    -DTFT_DC=7
    -DTFT_RST=4
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_MISO=13
    -DTFT_BL=21
    -DUSE_FSPI_PORT
    -DTOUCH_CS=14
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLV_CONF_SKIP=1
    -DLV_USE_PERF_MONITOR=0
    -DLV_MEM_CUSTOM=1
    -DLV_MEMCPY_MEMSET_STD=1
    -DLV_USE_IME_PINYIN=0
    -DLV_USE_FLOAT=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_48=1
    -DCT_REQUIRED_FLASH_BYTES=4194304
    ; --- size trimming for the 4 MB slot ---
    ; LVGL widgets that tft_ui.cpp never creates (it uses obj, label, btn,
    ; textarea, dropdown, tabview, list, bar, keyboard, checkbox).
    -DLV_USE_ANIMIMG=0
    -DLV_USE_CALENDAR=0
    -DLV_USE_CHART=0
    -DLV_USE_COLORWHEEL=0
    -DLV_USE_IMGBTN=0
    -DLV_USE_LED=0
    -DLV_USE_MENU=0
    -DLV_USE_METER=0
    -DLV_USE_MSGBOX=0
    -DLV_USE_ROLLER=0
    -DLV_USE_SLIDER=0
    -DLV_USE_SPAN=0
    -DLV_USE_SPINBOX=0
    -DLV_USE_SPINNER=0
    -DLV_USE_SWITCH=0
    -DLV_USE_TABLE=0
    -DLV_USE_TILEVIEW=0
    -DLV_USE_WIN=0
    ; BLE is peripheral-only (GATT server): drop client/scanner code.
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
extra_scripts = pre:scripts/cartouch_4mb_fs.py

[env:esp32-s3-4mb-psram]
extends = env:esp32-s3-4mb
board = cartouch-esp32-s3-4mb-qspi-psram
board_build.psram = enable
build_flags =
    ${env:esp32-s3-4mb.build_flags}
    -DBOARD_HAS_PSRAM
    -DCONFIG_LVGL_USE_PSRAM=1

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<can_service.cpp> +<ct_sync_policy.cpp>
build_flags = -std=c++11 -Isrc -DUNIT_TEST
lib_deps =
    bblanchon/ArduinoJson@7.4.3
